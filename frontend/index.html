<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#E4E2DC" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#151514" media="(prefers-color-scheme: dark)" />
    <script>
      // apply a saved theme before first paint so there's no flash
      try {
        var t = localStorage.getItem('theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>bballguessr</title>
    <meta name="description" content="Guess the NBA player from their basketball-reference stat lines. Five players, three guesses each." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://bballguessr.vercel.app" />
    <meta property="og:title" content="bballguessr" />
    <meta property="og:description" content="Guess the NBA player from their stats. Five players, three guesses each." />
    <meta property="og:image" content="https://bballguessr.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="bballguessr wordmark beside a halftone basketball" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://bballguessr.vercel.app/og.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
